[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-retail-brain"
version = "0.1.0"
description = "An auditable replenishment decision pipeline for instant-retail and front-warehouse operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Instant Retail Brain contributors" }]
dependencies = []

[project.optional-dependencies]
lightgbm = ["lightgbm[scikit-learn]>=4.0,<5"]
test = ["jsonschema>=4.22,<5"]
demo = ["streamlit>=1.36,<2"]
research-llm = ["openai>=1.40,<2"]

[project.scripts]
ird = "ird.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
