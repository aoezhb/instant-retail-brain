name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src tests examples
      - run: python -m unittest discover -s tests -t . -v

  lightgbm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[lightgbm,test]"
      - run: python -m compileall -q src tests examples
      - run: python -m unittest discover -s tests -t . -v

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[demo,test]"
      - run: python -m compileall -q src tests examples
      - run: python -c "import streamlit; from ird.cli import run_demo; assert 'result_summary' in run_demo()"
